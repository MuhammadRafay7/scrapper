  # Selling language is distinctive, so the gate can sit a little higher than
  # the vets config without losing real sellers.
  page_threshold: 6.0
  domain_threshold: 5.0

discovery:
  osm:
    enabled: true
    tags:
      - shop=pet                  # COMPANION / AVIAN / AQUATIC / REPTILE retail
      - amenity=animal_breeding   # breeders, where mapped
      - leisure=horse_riding      # stables & equestrian centres - many sell horses
      - shop=agrarian             # farm supply, well connected to livestock keepers
      - shop=farm                 # farm shops, often direct livestock sellers
      - amenity=animal_boarding   # catteries/kennels, frequently also breeders
      - landuse=animal_keeping
    countries: []                 # empty = all of Europe; override with --countries
    per_country_delay: 8.0
    # Prospecting mode: only businesses with NO website of their own. They have no
    # online sales channel, so Occuin is the channel. Applied as an Overpass tag
    # negation, so the sweep is much faster and never queues their sites to crawl.
    # Set false to go back to collecting everyone.
    skip_with_website: true

  search:
    provider: none                # no budget

  # The cattle/goat/sheep gap is closed here, not by OSM. These are real, verified
  # public directories - each either links out to breeder sites or publishes
  # member contact details on its own listing pages (the crawler handles both).
  #
  # CHECK TERMS BEFORE ENABLING ANY OF THESE. Several breed registries permit
  # public browsing but forbid reuse of the register for marketing; that is a
  # per-site decision and it is yours to make, not the tool's.
  directories:
    # --- aggregators: lists OF breed societies (highest leverage) ---
    - https://www.stackyard.com/pedigree/html/irecattle.html   # 9 Irish cattle societies
    - https://www.nationalbeefassociation.com/supporters/breed-societies/
    - https://www.scottishbeefassociation.co.uk/supporters/breed-societies/
    - https://www.schafzucht-mv.de/landesschaf-und-ziegenzuchtverbaende-in-deutschland/
    - https://www.landwirtschaftskammer.de/landwirtschaft/tierproduktion/tierzuchtrecht/zuchtverbaende/index.htm
    - https://www.rvo.nl/onderwerpen/fokkerij                  # NL recognised breeding orgs

    # --- cattle: breeder locators with outbound links to breeder sites ---
    - https://www.charolais.co.uk/society/breeders/            # verified: links to breeder domains
    - https://charolais.ie/breeder-locator/
    - https://irishlimousin.com/
    - https://limousin.co.uk/

    # --- goats & sheep ---
    - https://www.ziegenzucht.de/verband/mitglieder/           # member list with contact details
    - https://thueringer-ziegen.de/
    - https://www.ziegen-sind-toll.com/                        # BDZ, 13 regional associations
    - https://www.britishgoatsociety.com/services/contacts/
    - https://www.bbmga.co.uk/
    - https://www.britishboergoatsociety.co.uk/
    - http://www.ibga.ie/
    - https://pygmygoatclub.org.uk/index.php/contacts/breeders-list

    # --- livestock marts & auctions (also strong Occuin prospects themselves,
    #     given the live-auction feature) ---
    - https://www.farmersforum.ie/marts-in-ireland/            # ~94 Irish marts
    - https://www.stackyard.com/marts/
    - https://imel.co.uk/uk-livestock-auction-mart-directory/
    - https://www.auctionfinder.co.uk/find_mart

    # --- horses / studbooks ---
    - https://angloeuropeanstudbook.co.uk/
    - https://www.kwpn.nl/

    # --- France: general breeder directories, noisy but large; the niche gate
    #     does the filtering ---
    - https://agriculture-selection-bovine.annuairefrancais.fr/index.html
    - https://agriculteur-eleveur.annuairefrancais.fr/index.html
    - https://elevage.annuairefrancais.fr/index.html

  # Deliberately NOT included: pagesjaunes.fr and similar general business
  # directories that prohibit automated extraction in their terms, and the WBFSH
  # studbook member list, which is a PDF (the crawler only reads HTML).

  seeds: []
  use_sitemaps: true
  sitemap_max_urls: 150

crawl:
  concurrency: 20
  per_domain_delay: 2.0
  timeout: 20
  max_pages_per_domain: 15   # sellers list stock across several pages, unlike vets
  max_depth: 2
  max_total_pages: 80000
  respect_robots: true
  allow_subdomains: true
  priority_paths:
    - contact
    - kontakt
    - contacto
    - contatti
    - impressum
    - mentions-legales
    - about
    - over-ons
    - team
    - sale
    - for-sale
    - sales
    - verkauf
    - verkaufspferde
    - te-koop
    - a-vendre
    - en-venta
    - vendita
    - sprzedaz
    - breeding
    - zucht
    - elevage
    - stock
    - animals
    - horses
    - cattle
    - livestock
    - puppies

filters:
  keep_role_addresses: true
  require_matching_domain: false
