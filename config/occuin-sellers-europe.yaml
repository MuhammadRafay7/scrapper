# ---------------------------------------------------------------------------
# Occuin seller acquisition: people with animals to sell.
# Maps to the Category enum: LIVESTOCK, COMPANION, AVIAN, AQUATIC, REPTILE, EXOTIC.
#
#   python -m scrapper osm    -c config/occuin-sellers-europe.yaml --countries IE,NL,BE
#   python -m scrapper crawl  -c config/occuin-sellers-europe.yaml --max-pages 5000
#   python -m scrapper export -c config/occuin-sellers-europe.yaml -o data/sellers.csv
#
# Coverage warning: OSM maps pet shops, stables and breeders well. It does NOT
# map cattle/goat/sheep breeders - those live in breed-society herd books and
# livestock mart sites, which have to go in `directories:` below.
# ---------------------------------------------------------------------------

database: data/occuin-sellers.db

niche:
  name: "pet, equine and livestock sellers (Occuin seller acquisition)"

  # "sells animals" is the signal. Species alone is not enough - a vet, a shelter
  # and a pet blog all mention dogs. Selling/breeding language is what separates them.
  strong:
