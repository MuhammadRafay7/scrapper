# ---------------------------------------------------------------------------
# Occuin -> European veterinary practices. Pairs with config/vets-europe.yaml,
# which does the scraping.
#
#   python -m scrapper mail check   -c config/campaigns/vets.yaml
#   python -m scrapper mail build   -c config/campaigns/vets.yaml
#   python -m scrapper mail preview -c config/campaigns/vets.yaml -n 5
#   python -m scrapper mail test    -c config/campaigns/vets.yaml --to velos.coo@gmail.com
#   python -m scrapper mail send    -c config/campaigns/vets.yaml            # dry run
#   python -m scrapper mail send    -c config/campaigns/vets.yaml --live --limit 20
#
# Credentials come from .env (gitignored):  set -a; source .env; set +a
# ---------------------------------------------------------------------------

id: occuin-vets-eu

database: data/vets.db          # the scrape, from config/vets-europe.yaml
outreach_db: data/outreach.db   # shared send queue - throttles count across ALL campaigns
suppression_db: data/suppression.db
preview_dir: data/previews
log_file: data/sent.log

sender:
  # Company identity, no personal details.
  from_name: "Occuin"
  from_email: "velos.coo@gmail.com"
  reply_to: "velos.coo@gmail.com"

  # Sending without a postal address is a deliberate choice here. The legal
  # requirement (CAN-SPAM, EU e-Commerce Directive) does not go away - this flag
  # only stops the tool from blocking the send. Fill postal_address in and set
  # this back to false the moment Occuin has a registered address.
  postal_address: ""
  omit_postal_address: true

  # What the reader sees. The raw mailto: URL stays out of the body and rides in
  # the List-Unsubscribe header instead, where Gmail/Outlook can use it.
  opt_out_instruction: "Not interested? Reply with STOP and we won't contact you again."
  # Opt-outs arrive as ordinary replies in the Gmail inbox above. YOU MUST READ
  # THEM. When one comes in, run:
  #   python -m scrapper mail suppress -c <this file> <address>
  unsubscribe_mailto: "velos.coo@gmail.com"
  # Better, once /unsubscribe exists on the site - enables one-click unsubscribe
  # in Gmail/Outlook, which measurably helps inbox placement:
  # unsubscribe_url: "https://www.occuin.com/unsubscribe"

smtp:
  host: smtp.gmail.com
  port: 587
  starttls: true
  user_env: SMTP_USER
  password_env: SMTP_PASSWORD

message:
  # Variant B, measured: reaches the Gmail Primary tab. No UTM parameters, one
  # link, no promotional vocabulary, ends on a question. Changing any of those
  # risks dropping back into Promotions - retest if you edit this.
  subject: "Occuin - a page for {{ business|your practice }}?"
  text_file: ../bodies/vets-primary.txt

extra:
  campaign_tag: "vets-eu"       # lands in the UTM, so signups are attributable

audience:
  # vets-europe.yaml runs thresholds at 3.0, and OSM-sourced domains are
  # pre-accepted by their map tag, so this only needs to clear the noise floor.
  min_score: 4.0
  # Vets publish praxis@ / info@ - those are the correct contact for a practice
  # and carry less GDPR risk than a named individual's address.
  personal_only: false
  matching_domain_only: true
  max_per_domain: 1
  # Only businesses with no website of their own - the ones a free storefront
  # actually helps. Turn off to reach the full scraped audience.
  no_website_only: true
  limit: 0
  exclude_domains: []

throttle:
  # Raised on request to clear the whole queue in one day (~326 per account).
  # Gmail's hard stop is ~500/day per consumer account, so this stays under it,
  # but it is far above a normal ramp for a mailbox with no sending history.
  # The 20s spacing is what keeps it from looking like a burst - keep it.
  # Counted PER SENDING ACCOUNT.
  delay_seconds: 20
  per_hour: 200
  per_day: 400
  max_per_run: 0
