# ---------------------------------------------------------------------------
# Occuin -> European pet shops/breeders, SECOND sending account.
#
# Same audience and copy as sellers.yaml, different mailbox. Contacts already
# queued by any other campaign are skipped automatically (audience.allow_recontact
# is false), so nobody is mailed twice - run `mail build` on sellers.yaml FIRST,
# then this one, and the remainder lands here.
#
# Throttles are counted per sending account, so this account gets its own 200/day.
# Note both accounts sign in from the same machine and IP, which links them: a
# complaint problem on one can take out the other.
#
#   python -m scrapper mail check   -c config/campaigns/sellers-b.yaml
#   python -m scrapper mail build   -c config/campaigns/sellers-b.yaml
#   python -m scrapper mail preview -c config/campaigns/sellers-b.yaml -n 5
#   python -m scrapper mail test    -c config/campaigns/sellers-b.yaml --to velos.coo@gmail.com
#   python -m scrapper mail send    -c config/campaigns/sellers-b.yaml            # dry run
#   python -m scrapper mail send    -c config/campaigns/sellers-b.yaml --live --limit 20
#
# Credentials come from .env (gitignored):  set -a; source .env; set +a
# ---------------------------------------------------------------------------

id: occuin-sellers-eu-b

database: data/occuin-sellers.db   # the scrape, from config/occuin-sellers-europe.yaml
outreach_db: data/outreach.db   # shared send queue - throttles count across ALL campaigns
suppression_db: data/suppression.db
preview_dir: data/previews
log_file: data/sent.log

sender:
  # Company identity, no personal details.
  from_name: "Occuin"
  from_email: "animaleum.co@gmail.com"
  reply_to: "animaleum.co@gmail.com"

  # Sending without a postal address is a deliberate choice here. The legal
  # requirement (CAN-SPAM, EU e-Commerce Directive) does not go away - this flag
  # only stops the tool from blocking the send. Fill postal_address in and set
  # this back to false the moment Occuin has a registered address.
  postal_address: ""
  omit_postal_address: true

  # What the reader sees. The raw mailto: URL stays out of the body and rides in
  # the List-Unsubscribe header instead, where Gmail/Outlook can use it.
  opt_out_instruction: "Not interested? Reply with STOP and we won't contact you again."
  # Opt-outs arrive as ordinary replies in the Gmail inbox above. YOU MUST READ
  # THEM. When one comes in, run:
  #   python -m scrapper mail suppress -c <this file> <address>
  unsubscribe_mailto: "animaleum.co@gmail.com"
  # Better, once /unsubscribe exists on the site - enables one-click unsubscribe
  # in Gmail/Outlook, which measurably helps inbox placement:
  # unsubscribe_url: "https://www.occuin.com/unsubscribe"

smtp:
  host: smtp.gmail.com
  port: 587
  starttls: true
  user_env: SMTP_USER_2
  password_env: SMTP_PASSWORD_2

message:
  # Variant B, measured: reaches the Gmail Primary tab. No UTM parameters, one
  # link, no promotional vocabulary, ends on a question. Changing any of those
  # risks dropping back into Promotions - retest if you edit this.
  subject: "Occuin - listing {{ business|your business }}?"
  text_file: ../bodies/sellers-primary.txt

extra:
  campaign_tag: "sellers-eu-b"       # lands in the UTM, so signups are attributable

audience:
  min_score: 5.0
  # Shops publish info@/sales@ - the right contact, and lower GDPR risk than a
  # named individual.
  personal_only: false
  # OFF, unlike the vets campaign: small shops and breeders routinely run their
  # business off gmail/yahoo, so their address domain never matches their site
  # domain. Requiring a match here would discard most of the audience.
  matching_domain_only: false
  max_per_domain: 1
  # Only businesses with no website of their own - the ones a free storefront
  # actually helps. Turn off to reach the full scraped audience.
  no_website_only: true
  limit: 0
  exclude_domains: []

throttle:
  # Raised on request to clear the whole queue in one day (~326 per account).
  # Gmail's hard stop is ~500/day per consumer account, so this stays under it,
  # but it is far above a normal ramp for a mailbox with no sending history.
  # The 20s spacing is what keeps it from looking like a burst - keep it.
  # Counted PER SENDING ACCOUNT.
  delay_seconds: 20
  per_hour: 200
  per_day: 400
  max_per_run: 0
